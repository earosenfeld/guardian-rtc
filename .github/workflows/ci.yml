name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ros:humble

    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: |
          apt-get update && apt-get install -y python3-pip pkg-config \
            libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev \
            libavfilter-dev libswscale-dev libswresample-dev \
            libopus-dev libvpx-dev libsrtp2-dev
          pip3 install --upgrade pip
          pip3 install -r requirements.txt pytest pytest-cov

      - name: Build ROS 2 workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd ros_ws
          colcon build --event-handlers console_direct+

      - name: Smoke-test installed packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source ros_ws/install/setup.bash
          python3 -c "from guardian_rtc_msgs.msg import StopEvent, SafetyStatus, ControlCommand; print(StopEvent())"
          python3 -c "import guardian_rtc.config, guardian_rtc.utils.dynamics"

      - name: Run kinetic-energy tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source ros_ws/install/setup.bash
          python3 -m pytest ros_ws/src/guardian_rtc_tests/test_ke_limit.py -q --no-cov --no-cov
