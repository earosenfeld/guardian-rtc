name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ros:humble
      
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        apt-get update && apt-get install -y \
          python3-pip \
          python3-dev \
          git
        pip3 install --no-cache-dir \
          hatch \
          ruff \
          mypy \
          black \
          pytest \
          pytest-cov
    
    - name: Lint
      run: |
        ruff check .
        mypy .
    
    - name: Test
      run: |
        cd ros_ws
        colcon build
        source install/setup.bash
        pytest src/guardian_rtc_tests
        
    - name: Build Docker image
      run: |
        docker build -t guardianrtc:test -f docker/ci.Dockerfile . 